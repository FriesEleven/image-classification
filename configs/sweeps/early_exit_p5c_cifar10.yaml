name: early_exit_p5c_cifar10_serial
description: >-
  P5-C training-component ablation on the frozen CIFAR-10 development split.
  Runs A1, A2, and A3 serially for seeds 54/55/56 without test evaluation.
seeds: [54, 55, 56]
experiments:
  - configs/experiments/early_exit_p5c_cifar10_a1.yaml
  - configs/experiments/early_exit_p5c_cifar10_a2.yaml
  - configs/experiments/early_exit_p5c_cifar10_a3.yaml
